<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recent Work Prototypes 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #B5532F; --accent-hover: #934126; --accent-on-dark: #E08A66;
    --ink: #16181D; --ink-2: #3B3E45; --muted: #5F6268;
    --paper: #FAFAF8; --stone: #E7E5E1; --line: #D3D0CA;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Manrope', system-ui, -apple-system, sans-serif;
    --pad: clamp(16px, 4vw, 56px);
    --nav: 68px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { overflow-x: clip; }
  img { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--pad); }

  /* ---------- shared context ---------- */
  .ctx-nav { position: sticky; top: 0; z-index: 30; background: rgba(250,250,248,.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .ctx-nav .wrap { display: flex; align-items: center; justify-content: space-between; height: var(--nav); }
  .ctx-logo { font-family: var(--serif); font-size: 24px; font-weight: 600; }
  .ctx-logo b { color: var(--accent); font-weight: 600; }
  .ctx-links { display: flex; gap: 28px; font-size: 15px; color: var(--ink-2); }
  .ctx-cta { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 11px 18px; font: 600 14px var(--sans); }
  @media (max-width: 760px) { .ctx-links { display: none; } }
  .ctx-prev { background: var(--stone); padding: 56px 0; text-align: center; color: var(--muted); font-size: 14px; }
  .sec { padding: clamp(64px, 9vw, 120px) 0 clamp(72px, 10vw, 140px); }
  .sec-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: end; margin-bottom: clamp(40px, 6vw, 72px); }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .sec-head h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(44px, 5.6vw, 76px); line-height: 1.02; letter-spacing: -0.01em; margin: 14px 0 0; }
  .sec-head h2 em { color: var(--accent); }
  .sec-head p { color: var(--ink-2); font-size: 17px; line-height: 1.65; margin: 0; max-width: 46ch; justify-self: end; }
  @media (max-width: 900px) { .sec-head { grid-template-columns: 1fr; gap: 16px; } .sec-head p { justify-self: start; } }
  .ctx-next { background: var(--stone); padding: 64px 0; color: var(--muted); font-size: 14px; text-align: center; }

  .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 12px 18px; font: 600 14px var(--sans); cursor: pointer; transition: background-color 150ms ease-out, transform 160ms var(--ease-out); }
  .btn:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .btn:hover { background: var(--accent-hover); } }
  .hl { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .hl li { padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--ink-2); display: flex; gap: 12px; }
  .hl li::before { content: ""; flex: 0 0 6px; height: 6px; margin-top: 7px; border-radius: 50%; background: var(--accent); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* =================== 4. INDEX — editorial project list =================== */
  .ix { border-top: 1px solid var(--ink); }
  .ix-row { border-bottom: 1px solid var(--line); }
  .ix-head { display: grid; grid-template-columns: 56px minmax(0, 1fr) 190px 190px 40px; gap: 20px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 26px 0; cursor: pointer; transition: opacity 250ms ease-out; }
  .ix-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .ix-n { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ix-t { font-family: var(--serif); font-weight: 500; font-size: clamp(26px, 3vw, 42px); line-height: 1.08; transition: transform 300ms var(--ease-out), color 200ms ease-out; }
  .ix-c, .ix-a { font-size: 14px; color: var(--ink-2); }
  .ix-a { color: var(--muted); }
  .ix-plus { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); position: relative; transition: background-color 200ms ease-out, border-color 200ms ease-out, transform 300ms var(--ease-out); }
  .ix-plus::before, .ix-plus::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 1.5px; background: var(--ink); transform: translate(-50%, -50%); transition: background-color 200ms ease-out; }
  .ix-plus::after { transform: translate(-50%, -50%) rotate(90deg); }
  .ix-thumb { display: none; }
  @media (hover: hover) and (pointer: fine) {
    .ix:hover .ix-head { opacity: .45; }
    .ix .ix-head:hover, .ix .ix-row[data-open] .ix-head { opacity: 1; }
    .ix-head:hover .ix-t { transform: translateX(10px); color: var(--accent); }
  }
  .ix-row[data-open] .ix-t { color: var(--accent); }
  .ix-row[data-open] .ix-plus { transform: rotate(45deg); background: var(--ink); border-color: var(--ink); }
  .ix-row[data-open] .ix-plus::before, .ix-row[data-open] .ix-plus::after { background: var(--paper); }
  .ix-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 500ms var(--ease-out); }
  .ix-row[data-open] .ix-body { grid-template-rows: 1fr; }
  .ix-body > div { overflow: hidden; }
  .ix-in { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: clamp(24px, 4vw, 56px); padding: 4px 0 36px 76px; opacity: 0; transform: translateY(8px); transition: opacity 250ms ease-out, transform 400ms var(--ease-out); }
  .ix-row[data-open] .ix-in { opacity: 1; transform: none; transition-delay: 120ms; }
  .ix-img { aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden; background: var(--stone); }
  .ix-img img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.06); transition: transform 1200ms var(--ease-out); }
  .ix-row[data-open] .ix-img img { transform: none; }
  .ix-in p { color: var(--ink-2); font-size: 15px; line-height: 1.7; margin: 0 0 18px; }
  .ix-in .hl { margin-bottom: 22px; }
  .ix-float { position: fixed; left: 0; top: 0; z-index: 25; width: 300px; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; pointer-events: none; opacity: 0; box-shadow: 0 24px 60px rgba(22,24,29,.22); transition: opacity 200ms ease-out; will-change: transform, opacity; }
  .ix-float[data-show] { opacity: 1; }
  .ix-float img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 250ms ease-out; }
  .ix-float img[data-on] { opacity: 1; }
  @media (max-width: 900px) {
    .ix-head { grid-template-columns: 32px minmax(0, 1fr) 64px; gap: 12px; padding: 18px 0; }
    .ix-c, .ix-a, .ix-plus { display: none; }
    .ix-thumb { display: block; width: 64px; height: 48px; border-radius: 4px; overflow: hidden; }
    .ix-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .ix-meta-m { display: block !important; font-family: var(--sans); font-size: 13px; color: var(--muted); margin-top: 4px; }
    .ix-in { grid-template-columns: 1fr; padding-left: 0; }
  }
  .ix-meta-m { display: none; }

  /* =================== 5. CHAPTERS — stacking full-bleed panels =================== */
  .ch { margin-inline: calc(50% - 50vw); }
  .ch-panel { position: sticky; top: var(--nav); height: calc(100vh - var(--nav)); overflow: hidden; }
  .ch-inner { position: absolute; inset: 0; transform-origin: center top; will-change: transform; overflow: hidden; }
  .ch-inner img { width: 100%; height: 100%; object-fit: cover; }
  .ch-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(16,16,18,0) 22%, rgba(16,16,18,.38) 52%, rgba(16,16,18,.82) 100%); }
  .ch-copy { text-shadow: 0 1px 18px rgba(16,16,18,.35); }
  .ch-dim { position: absolute; inset: 0; background: #101114; opacity: 0; pointer-events: none; }
  .ch-copy { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 var(--pad) clamp(28px, 5vh, 56px); color: #fff; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: 40px; align-items: end; max-width: 1312px; margin: 0 auto; }
  .ch-copy > * { opacity: 0; transform: translateY(18px); transition: opacity 600ms ease-out, transform 900ms var(--ease-out); }
  .ch-panel.is-in .ch-copy > * { opacity: 1; transform: none; }
  .ch-panel.is-in .ch-copy > *:nth-child(2) { transition-delay: 90ms; }
  .ch-num { display: inline-flex; gap: 12px; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: .08em; color: #fff; background: rgba(16,16,18,.42); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 7px 12px; border-radius: 999px; text-shadow: none; }
  .ch-num .tag { color: #F2B79E; }
  .ch-copy h3 { font-family: var(--serif); font-weight: 500; font-size: clamp(40px, 6.2vw, 96px); line-height: .98; letter-spacing: -0.01em; margin: 14px 0 10px; }
  .ch-area { font-size: 15px; color: rgba(255,255,255,.8); }
  .ch-side p { margin: 0 0 18px; font-size: 15px; line-height: 1.65; color: rgba(255,255,255,.88); }
  .ch-side .btn { background: var(--paper); color: var(--ink); }
  @media (hover: hover) and (pointer: fine) { .ch-side .btn:hover { background: #fff; } }
  .ch-count { position: absolute; top: 22px; right: var(--pad); color: #fff; font-size: 13px; font-variant-numeric: tabular-nums; background: rgba(16,16,18,.35); backdrop-filter: blur(6px); padding: 7px 12px; border-radius: 999px; }
  @media (max-width: 900px) {
    .ch-panel { height: calc(88svh - var(--nav)); }
    .ch-copy { grid-template-columns: 1fr; gap: 12px; }
    .ch-side p { display: none; }
  }

  /* =================== 6. SPOTLIGHT — craft details on the photo =================== */
  .sp { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: clamp(28px, 4vw, 56px); align-items: start; }
  .sp-frame { position: relative; aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden; background: var(--stone); }
  .sp-frame > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.04); transition: opacity 450ms ease-out, transform 1200ms var(--ease-out); }
  .sp-frame > img[data-on] { opacity: 1; transform: none; }
  .sp-dot { position: absolute; z-index: 3; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 50%; border: 0; padding: 0; background: rgba(250,250,248,.92); box-shadow: 0 4px 14px rgba(16,16,18,.25); cursor: pointer; display: grid; place-items: center; animation: rise 400ms var(--ease-out) both; transition: transform 160ms var(--ease-out), background-color 200ms ease-out; }
  .sp-dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); transition: transform 200ms var(--ease-out), background-color 200ms ease-out; }
  .sp-dot::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1.5px solid rgba(250,250,248,.9); animation: sp-ring 2.4s ease-out infinite; }
  .sp[data-calm] .sp-dot::before { animation: none; opacity: 0; }
  @keyframes sp-ring { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
  .sp-dot:active { transform: scale(0.92); }
  .sp-dot[data-on] { background: var(--accent); }
  .sp-dot[data-on]::after { background: #fff; transform: scale(.6); }
  .sp-dot:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .sp-pop { position: absolute; z-index: 4; width: 240px; padding: 14px 16px; border-radius: 8px; background: var(--paper); color: var(--ink); box-shadow: 0 18px 44px rgba(16,16,18,.28); pointer-events: none; opacity: 0; transform: scale(.96); transition: opacity 150ms ease-out, transform 200ms var(--ease-out); }
  .sp-pop[data-show] { opacity: 1; transform: none; pointer-events: auto; }
  .sp-pop b { display: block; font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.15; margin-bottom: 4px; }
  .sp-pop span { font-size: 13px; line-height: 1.5; color: var(--ink-2); }
  .sp-hint { position: absolute; left: 16px; top: 16px; z-index: 3; color: #fff; font-size: 12px; background: rgba(16,16,18,.45); backdrop-filter: blur(6px); padding: 7px 11px; border-radius: 999px; transition: opacity 300ms ease-out; }
  .sp[data-calm] .sp-hint { opacity: 0; }
  .sp-thumbs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  .sp-thumbs button { position: relative; aspect-ratio: 4 / 3; border: 0; padding: 0; border-radius: 4px; overflow: hidden; cursor: pointer; background: var(--stone); opacity: .55; transition: opacity 200ms ease-out, transform 160ms var(--ease-out); }
  .sp-thumbs button img { width: 100%; height: 100%; object-fit: cover; }
  .sp-thumbs button::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 300ms var(--ease-out); }
  .sp-thumbs button[data-on] { opacity: 1; }
  .sp-thumbs button[data-on]::after { transform: none; }
  .sp-thumbs button:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .sp-thumbs button:hover { opacity: .9; } }
  .sp-thumbs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sp-side > * { animation: rise 450ms var(--ease-out) both; }
  .sp-side > *:nth-child(2) { animation-delay: 40ms; } .sp-side > *:nth-child(3) { animation-delay: 80ms; } .sp-side > *:nth-child(4) { animation-delay: 120ms; } .sp-side > *:nth-child(5) { animation-delay: 160ms; }
  .sp-num { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--accent); margin-right: 10px; }
  .sp-side h3 { font-family: var(--serif); font-weight: 500; font-size: clamp(30px, 2.8vw, 42px); line-height: 1.06; margin: 12px 0 6px; }
  .sp-area { font-size: 14px; color: var(--muted); margin: 0 0 16px; }
  .sp-side p { color: var(--ink-2); font-size: 15px; line-height: 1.7; margin: 0 0 18px; }
  .sp-details { list-style: none; margin: 0 0 22px; padding: 0; border-top: 1px solid var(--line); }
  .sp-details button { display: grid; grid-template-columns: 26px 1fr; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 0; cursor: pointer; font-size: 14px; color: var(--ink-2); transition: color 150ms ease-out; }
  .sp-details button span { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 600; transition: background-color 200ms ease-out, color 200ms ease-out, border-color 200ms ease-out; }
  .sp-details button[data-on] { color: var(--ink); }
  .sp-details button[data-on] span { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (hover: hover) and (pointer: fine) { .sp-details button:hover { color: var(--ink); } }
  @media (max-width: 900px) {
    .sp { grid-template-columns: 1fr; }
    .sp-frame { aspect-ratio: 4 / 3; }
    .sp-pop { width: 200px; }
    .sp-thumbs { gap: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 0ms !important; transition-delay: 0ms !important; }
    .ch-inner { transform: none !important; }
  }

  /* =================== PICKER (verbatim from PICKER.md) =================== */
  .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
  .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out, transform 160ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (hover: hover) and (pointer: fine) { .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); } }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }
  .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
  <header class="ctx-nav"><div class="wrap">
    <div class="ctx-logo"><b>MN</b> Interiors</div>
    <nav class="ctx-links"><span>Our work</span><span>Services</span><span>Reviews</span><span>FAQ</span></nav>
    <button class="ctx-cta" type="button">Get a free quote</button>
  </div></header>
  <div class="ctx-prev">Previous section · Hero</div>

  <section class="sec" id="our-work"><div class="wrap">
    <div class="sec-head">
      <div>
        <div class="eyebrow">Our work</div>
        <h2>Homes we've <em>finished.</em></h2>
      </div>
      <p>Recent kitchens, wardrobes, pooja units and shop interiors, built in our own Kundrathur workshop and fitted in homes across Chennai.</p>
    </div>
    <div id="stage"></div>
  </div></section>

  <div class="ctx-next">Next section · Services</div>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Index</button>
    <button class="proto-picker-item">Chapters</button>
    <button class="proto-picker-item">Spotlight</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>

  { key: 'pooja', w: 1200, h: 896, cat: 'Pooja & TV units', title: 'Decorative peacock pooja unit', area: 'Kavanur, Chennai',
    sum: 'A peaceful home mandapam with matte double doors featuring traditional peacock and diya lattice cut-outs, warm golden backlighting, a storage drawer and side glass niches for lamps.',
    hl: ['Precision peacock and diya lattice door work', 'Warm golden lighting on brass lamps and idols', 'Bottom drawer for pooja essentials'], scope: 'Pooja Room / TV Unit',
    spots: [ { x: 42, y: 42, t: 'Peacock lattice doors', d: 'Precision-cut peacock and diya patterns, backlit so they glow during evening pooja.' },
             { x: 74, y: 30, t: 'Lit glass niches', d: 'Side niches with warm spotlights for brass lamps and idols.' },
             { x: 50, y: 86, t: 'Drawer for essentials', d: 'A full-width drawer keeps camphor, wicks and incense close at hand.' } ] },
  { key: 'wardrobe', w: 1200, h: 896, cat: 'Wardrobes', title: 'Full-height bedroom wardrobes and loft', area: 'Anna Nagar, Chennai',
    sum: 'Floor-to-ceiling wardrobes with seamless overhead loft storage, warm matte beige shutters with slim wood trims, long easy-grip handles and calm ceiling cove lighting.',
    hl: ['Ceiling-height lofts that use every inch', 'Even door alignment with sturdy, smooth hinges', 'Warm matte finish with solid-wood accent trims'], scope: 'Wardrobes & Bedrooms',
    spots: [ { x: 34, y: 20, t: 'Ceiling-height lofts', d: 'Loft shutters line up with the wardrobe below for one clean, continuous wall.' },
             { x: 14, y: 58, t: 'Solid-wood trims', d: 'Slim vertical wood trims double as long, easy-grip handles.' },
             { x: 78, y: 14, t: 'Cove lighting', d: 'A false-ceiling cove adds soft, indirect light across the shutters.' } ] },
  { key: 'shop', w: 1376, h: 768, cat: 'Living & shops', title: 'Modern retail shop and display interiors', area: 'Chennai, commercial',
    sum: 'A neat, welcoming shop interior with a custom fluted-wood billing counter, illuminated built-in wall shelves, clean ceiling spotlights and an organised floor layout.',
    hl: ['Fluted-wood billing counter built in-house', 'Lit wall shelving designed for product display', 'Durable finishes for daily customer footfall'], scope: 'Shop / Commercial Interiors',
    spots: [ { x: 70, y: 80, t: 'Fluted billing counter', d: 'Built in our Kundrathur workshop, with a hard-wearing top for daily use.' },
             { x: 82, y: 33, t: 'Lit display shelving', d: 'Warm LED under each shelf makes products stand out from across the store.' },
             { x: 46, y: 14, t: 'Track spotlights', d: 'Adjustable ceiling spots so the lighting can follow changing displays.' } ] },
];
const N = P.length;
const n = i => String(i + 1).padStart(2, '0');
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const fine = () => matchMedia('(hover: hover) and (pointer: fine)').matches;
const hlList = p => `<ul class="hl">${p.hl.map(h => `<li>${h}</li>`).join('')}</ul>`;
const enquire = p => `<button class="btn" type="button" data-scope="${p.scope}">Enquire about a similar ${p.cat === 'Living & shops' ? 'shop' : 'design'} →</button>`;
let cleanup = [];

/* ---------------- 4. INDEX ---------------- */
function vIndex() {
  return `<div class="ix">${P.map((p, i) => `
    <div class="ix-row" data-i="${i}" ${i === 0 ? 'data-open' : ''}>
      <button class="ix-head" type="button" aria-expanded="${i === 0}" aria-controls="ix-b-${i}">
        <span class="ix-n">${n(i)}</span>
        <span class="ix-t">${p.title}<span class="ix-meta-m">${p.cat} · ${p.area}</span></span>
        <span class="ix-c">${p.cat}</span>
        <span class="ix-a">${p.area}</span>
        <span class="ix-plus" aria-hidden="true"></span>
        <span class="ix-thumb" aria-hidden="true"><img src="${IMG[p.key]}" alt="" /></span>
      </button>
      <div class="ix-body" id="ix-b-${i}" role="region" aria-label="${p.title}"><div>
        <div class="ix-in">
          <div class="ix-img"><img src="${IMG[p.key]}" alt="${p.title}, ${p.area}" loading="lazy" /></div>
          <div><p>${p.sum}</p>${hlList(p)}${enquire(p)}</div>
        </div>
      </div></div>
    </div>`).join('')}
  </div>
  <div class="ix-float" aria-hidden="true">${P.map(p => `<img src="${IMG[p.key]}" alt="" />`).join('')}</div>`;
}
function initIndex(root) {
  const rows = [...root.querySelectorAll('.ix-row')], float = root.querySelector('.ix-float'), fimgs = [...float.querySelectorAll('img')];
  rows.forEach(r => r.querySelector('.ix-head').addEventListener('click', () => {
    const open = r.hasAttribute('data-open');
    rows.forEach(x => { x.removeAttribute('data-open'); x.querySelector('.ix-head').setAttribute('aria-expanded', 'false'); });
    if (!open) { r.setAttribute('data-open', ''); r.querySelector('.ix-head').setAttribute('aria-expanded', 'true'); float.removeAttribute('data-show'); }
  }));
  if (!fine() || reduced()) return;
  let tx = 0, ty = 0, x = 0, y = 0, s = .92, raf = 0;
  const loop = () => {
    x += (tx - x) * .16; y += (ty - y) * .16;
    s += ((float.hasAttribute('data-show') ? 1 : .92) - s) * .2;
    float.style.transform = `translate3d(${x + 28}px, ${y - 110}px, 0) scale(${s})`;
    raf = requestAnimationFrame(loop);
  };
  const move = e => { tx = e.clientX; ty = e.clientY; };
  addEventListener('pointermove', move); raf = requestAnimationFrame(loop);
  rows.forEach((r, i) => {
    const head = r.querySelector('.ix-head');
    head.addEventListener('pointerenter', e => {
      if (r.hasAttribute('data-open')) return; // its photo is already open below
      if (!float.hasAttribute('data-show')) { x = tx = e.clientX; y = ty = e.clientY; }
      fimgs.forEach((m, j) => m.toggleAttribute('data-on', j === i));
      float.setAttribute('data-show', '');
    });
    head.addEventListener('pointerleave', () => float.removeAttribute('data-show'));
  });
  cleanup.push(() => { removeEventListener('pointermove', move); cancelAnimationFrame(raf); });
}

/* ---------------- 5. CHAPTERS ---------------- */
function vChapters() {
  return `<div class="ch">${P.map((p, i) => `
    <article class="ch-panel" data-i="${i}" style="z-index:${i + 1}">
      <div class="ch-inner">
        <img src="${IMG[p.key]}" alt="${p.title}, ${p.area}" ${i ? 'loading="lazy"' : ''} />
        <div class="ch-shade"></div>
        <div class="ch-count">${n(i)} / ${n(N - 1)}</div>
        <div class="ch-copy">
          <div><div class="ch-num"><span>${n(i)}</span><span class="tag">${p.cat}</span></div><h3>${p.title}</h3><div class="ch-area">${p.area}</div></div>
          <div class="ch-side"><p>${p.sum}</p>${enquire(p)}</div>
        </div>
        <div class="ch-dim"></div>
      </div>
    </article>`).join('')}
  </div>`;
}
function initChapters(root) {
  const panels = [...root.querySelectorAll('.ch-panel')];
  const inners = panels.map(p => p.querySelector('.ch-inner')), dims = panels.map(p => p.querySelector('.ch-dim'));
  let raf = 0;
  // As the next panel slides over, the current one shrinks slightly, rounds its corners and darkens.
  const frame = () => {
    raf = 0;
    const h = innerHeight - 68;
    panels.forEach((p, i) => {
      const next = panels[i + 1];
      let prog = 0;
      if (next) prog = Math.min(1, Math.max(0, (innerHeight - next.getBoundingClientRect().top) / h));
      if (reduced()) prog = 0;
      inners[i].style.transform = `scale(${1 - prog * 0.06})`;
      inners[i].style.borderRadius = `${prog * 14}px`;
      dims[i].style.opacity = prog * 0.55;
    });
  };
  const onScroll = () => { if (!raf) raf = requestAnimationFrame(frame); };
  addEventListener('scroll', onScroll, { passive: true }); addEventListener('resize', onScroll); frame();
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('is-in'); }), { threshold: 0.55 });
  panels.forEach(p => io.observe(p));
  cleanup.push(() => { removeEventListener('scroll', onScroll); removeEventListener('resize', onScroll); cancelAnimationFrame(raf); io.disconnect(); });
}

/* ---------------- 6. SPOTLIGHT ---------------- */
function spSide(i, d) {
  const p = P[i];
  return `<div><span class="sp-num">${n(i)}</span><span class="tag">${p.cat}</span></div>
    <h3>${p.title}</h3>
    <div class="sp-area">${p.area}</div>
    <p>${p.sum}</p>
    <div><ul class="sp-details">${p.spots.map((s, k) => `<li><button type="button" data-k="${k}" ${k === d ? 'data-on' : ''}><span>${k + 1}</span>${s.t}</button></li>`).join('')}</ul>${enquire(p)}</div>`;
}
function vSpot() {
  return `<div class="sp">
    <div>
      <div class="sp-frame">
        ${P.map((p, i) => `<img src="${IMG[p.key]}" alt="${p.title}, ${p.area}" ${i === 0 ? 'data-on' : ''} />`).join('')}
        <div class="sp-dots"></div>
        <div class="sp-pop" role="status" aria-live="polite"><b></b><span></span></div>
        <span class="sp-hint">Tap the dots to see the details</span>
      </div>
      <div class="sp-thumbs" role="group" aria-label="Choose a project">${P.map((p, i) => `<button type="button" data-i="${i}" ${i === 0 ? 'data-on' : ''} aria-label="${p.title}" aria-pressed="${i === 0}"><img src="${IMG[p.key]}" alt="" /></button>`).join('')}</div>
    </div>
    <div class="sp-side"></div>
  </div>`;
}
function initSpot(root) {
  const sp = root.querySelector('.sp'), frame = root.querySelector('.sp-frame'), imgs = [...frame.querySelectorAll(':scope > img')];
  const dotsBox = root.querySelector('.sp-dots'), pop = root.querySelector('.sp-pop'), side = root.querySelector('.sp-side');
  const thumbs = [...root.querySelectorAll('.sp-thumbs button')];
  let cur = 0, det = -1;
  // Map a point given in % of the original photo to the cover-cropped frame.
  const pos = (p, s) => {
    const fw = frame.clientWidth, fh = frame.clientHeight;
    const k = Math.max(fw / p.w, fh / p.h), ox = (fw - p.w * k) / 2, oy = (fh - p.h * k) / 2;
    return [ox + (s.x / 100) * p.w * k, oy + (s.y / 100) * p.h * k];
  };
  const layout = () => {
    const p = P[cur];
    [...dotsBox.children].forEach((d, k) => { const [x, y] = pos(p, p.spots[k]); d.style.left = x + 'px'; d.style.top = y + 'px'; });
    if (det >= 0) placePop();
  };
  const placePop = () => {
    const p = P[cur], [x, y] = pos(p, p.spots[det]);
    const fw = frame.clientWidth, fh = frame.clientHeight, pw = pop.offsetWidth, ph = pop.offsetHeight;
    if (fw < 600) { // phones: a strip along the edge furthest from the dot, so it never hides other dots nearby
      pop.style.width = (fw - 24) + 'px';
      pop.style.left = '12px';
      pop.style.top = (y < fh / 2 ? fh - pop.offsetHeight - 12 : 12) + 'px';
      pop.style.transformOrigin = `center ${y < fh / 2 ? 'bottom' : 'top'}`;
      return;
    }
    pop.style.width = '';
    const right = x + 26 + pw < fw;
    let left = right ? x + 26 : x - 26 - pw;
    let top = Math.min(Math.max(y - ph / 2, 12), fh - ph - 12);
    left = Math.min(Math.max(left, 12), fw - pw - 12);
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
    pop.style.transformOrigin = `${right ? 'left' : 'right'} center`;
  };
  const setDetail = (k, user) => {
    det = k;
    if (user) sp.setAttribute('data-calm', '');
    [...dotsBox.children].forEach((d, j) => { d.toggleAttribute('data-on', j === k); d.setAttribute('aria-pressed', j === k); });
    side.querySelectorAll('.sp-details button').forEach((b, j) => b.toggleAttribute('data-on', j === k));
    if (k < 0) { pop.removeAttribute('data-show'); return; }
    const s = P[cur].spots[k];
    pop.querySelector('b').textContent = s.t; pop.querySelector('span').textContent = s.d;
    pop.removeAttribute('data-show'); placePop();
    requestAnimationFrame(() => pop.setAttribute('data-show', ''));
  };
  const show = i => {
    cur = i; det = -1; pop.removeAttribute('data-show');
    imgs.forEach((m, j) => m.toggleAttribute('data-on', j === i));
    thumbs.forEach((t, j) => { t.toggleAttribute('data-on', j === i); t.setAttribute('aria-pressed', j === i); });
    dotsBox.innerHTML = P[i].spots.map((s, k) => `<button class="sp-dot" type="button" style="animation-delay:${200 + k * 70}ms" aria-label="Detail ${k + 1}: ${s.t}" aria-pressed="false"></button>`).join('');
    [...dotsBox.children].forEach((d, k) => d.addEventListener('click', e => { e.stopPropagation(); setDetail(det === k ? -1 : k, true); }));
    side.innerHTML = spSide(i, -1);
    side.querySelectorAll('.sp-details button').forEach(b => b.addEventListener('click', () => setDetail(+b.dataset.k, true)));
    layout();
  };
  thumbs.forEach((t, i) => t.addEventListener('click', () => { sp.setAttribute('data-calm', ''); show(i); }));
  frame.addEventListener('click', () => setDetail(-1));
  const onResize = () => layout();
  addEventListener('resize', onResize);
  const esc = e => { if (e.key === 'Escape' && det >= 0) { setDetail(-1); e.stopImmediatePropagation(); } };
  addEventListener('keydown', esc, true);
  show(0);
  cleanup.push(() => { removeEventListener('resize', onResize); removeEventListener('keydown', esc, true); });
}

const variants = [vIndex, vChapters, vSpot];
const inits = [initIndex, initChapters, initSpot];

document.addEventListener('click', e => {
  const b = e.target.closest('[data-scope]');
  if (b) alert(`Would open the booking form with "${b.dataset.scope}" preselected.`);
});

/* ---------- picker wiring (reference, plus per-variant init/cleanup) ---------- */
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  cleanup.forEach(f => f()); cleanup = [];
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); inits[i](stage); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
