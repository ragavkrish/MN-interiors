<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Across Chennai Options 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #B5532F; --accent-hover: #934126; --accent-soft: #F2B79E; --tint: #F6E7DF;
    --ink: #16181D; --ink-2: #3B3E45; --muted: #5F6268;
    --paper: #FAFAF8; --stone: #E7E5E1; --line: #D3D0CA;
    --sea: #DCE5E8; --sea-ink: #6F8D98;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Manrope', system-ui, -apple-system, sans-serif;
    --pad: clamp(16px, 4vw, 56px);
    --nav: 68px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { overflow-x: clip; }
  img { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--pad); }

  /* ---------- shared context ---------- */
  .ctx-nav { position: sticky; top: 0; z-index: 30; background: rgba(250,250,248,.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .ctx-nav .wrap { display: flex; align-items: center; justify-content: space-between; height: var(--nav); }
  .ctx-logo { font-family: var(--serif); font-size: 24px; font-weight: 600; }
  .ctx-logo b { color: var(--accent); font-weight: 600; }
  .ctx-links { display: flex; gap: 28px; font-size: 15px; color: var(--ink-2); }
  .ctx-cta { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 11px 18px; font: 600 14px var(--sans); }
  @media (max-width: 760px) { .ctx-links { display: none; } }
  .ctx-prev { background: var(--stone); padding: 56px 0; text-align: center; color: var(--muted); font-size: 14px; }
  .sec { padding: clamp(64px, 9vw, 120px) 0 clamp(72px, 10vw, 140px); }
  .sec-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: end; margin-bottom: clamp(32px, 4vw, 56px); }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .sec-head h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(44px, 5.6vw, 76px); line-height: 1.02; letter-spacing: -0.01em; margin: 14px 0 0; }
  .sec-head h2 em { color: var(--accent); }
  .sec-head p { color: var(--ink-2); font-size: 17px; line-height: 1.65; margin: 0; max-width: 46ch; justify-self: end; }
  @media (max-width: 900px) { .sec-head { grid-template-columns: 1fr; gap: 16px; } .sec-head p { justify-self: start; } }
  .ctx-next { background: var(--stone); padding: 64px 0; color: var(--muted); font-size: 14px; text-align: center; }

  .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 12px 18px; font: 600 14px var(--sans); cursor: pointer; text-decoration: none; transition: background-color 150ms ease-out, transform 160ms var(--ease-out); }
  .btn:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .btn:hover { background: var(--accent-hover); } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .note { font-size: 12px; color: var(--muted); margin: 12px 0 0; }
  .proj { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .proj img { width: 64px; height: 48px; object-fit: cover; border-radius: 4px; }
  .proj b { display: block; font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1.15; }
  .proj span { font-size: 13px; color: var(--muted); }
  .panel > * { animation: rise 380ms var(--ease-out) both; }
  .panel > *:nth-child(2) { animation-delay: 40ms; } .panel > *:nth-child(3) { animation-delay: 80ms; } .panel > *:nth-child(4) { animation-delay: 120ms; } .panel > *:nth-child(5) { animation-delay: 160ms; }
  .panel h3 { font-family: var(--serif); font-weight: 500; font-size: clamp(30px, 2.8vw, 40px); line-height: 1.05; margin: 10px 0 6px; }
  .panel .km { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px; }
  .panel .km b { font-family: var(--serif); font-weight: 500; font-size: 46px; line-height: 1; color: var(--accent); font-variant-numeric: lining-nums; }
  .panel .km span { font-size: 14px; color: var(--muted); }
  .panel .sub { font-size: 14px; color: var(--ink-2); line-height: 1.6; margin: 0 0 14px; }
  .panel .projs { border-top: 1px solid var(--line); margin-bottom: 20px; }
  .panel .none { margin: 0; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--muted); }

  /* =================== 4. PATCHWORK — tile map =================== */
  .pw { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: clamp(28px, 4vw, 56px); align-items: start; }
  .pw-grid { position: relative; display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 4px; }
  .pw-cell { aspect-ratio: 1; border-radius: 5px; }
  .pw-land { background: transparent; }
  .pw-sea { background: var(--sea); }
  .pw-tile { position: relative; aspect-ratio: 1; border: 0; padding: 6px 6px 5px; border-radius: 5px; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; background: var(--b); color: var(--c); transition: transform 160ms var(--ease-out), box-shadow 200ms ease-out; }
  .pw-tile .n { font-size: clamp(9px, .76vw, 10.5px); font-weight: 700; line-height: 1.12; letter-spacing: -0.01em; hyphens: manual; overflow-wrap: normal; word-break: normal; position: relative; z-index: 1; }
  .pw-tile .d { font-size: clamp(9px, .85vw, 11px); font-weight: 600; opacity: .8; position: relative; z-index: 1; font-variant-numeric: tabular-nums; }
  .pw-tile.photo { color: #fff; }
  .pw-tile.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .pw-tile.photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(16,16,18,.55), rgba(16,16,18,.05) 45%, rgba(16,16,18,.6)); }
  .pw-tile.photo .badge { position: absolute; z-index: 2; right: 5px; bottom: 5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 800; display: grid; place-items: center; }
  .pw-tile.home { background: var(--ink); color: #fff; }
  .pw-tile.home .n { font-family: var(--serif); font-size: clamp(11px, 1.05vw, 15px); font-weight: 600; }
  .pw-tile:active { transform: scale(.95); }
  .pw-tile[data-on] { box-shadow: 0 0 0 2.5px var(--paper), 0 0 0 5px var(--ink); z-index: 2; }
  .pw-tile:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) { .pw-tile:hover { transform: scale(1.06); z-index: 3; box-shadow: 0 10px 24px rgba(16,16,18,.22); } }
  .pw[data-zone] .pw-tile:not([data-z-on]) { filter: saturate(.25) opacity(.45); }
  .pw-tile, .pw-cell { opacity: 0; transform: scale(.85); }
  .pw-grid.is-in .pw-tile, .pw-grid.is-in .pw-cell { animation: pw-in 450ms var(--ease-out) forwards; animation-delay: var(--dl); }
  @keyframes pw-in { to { opacity: 1; transform: none; } }
  .pw-sealabel { position: absolute; right: calc(100% / var(--cols) * 0.5 - 9px); top: 6%; writing-mode: vertical-rl; font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--sea-ink); pointer-events: none; white-space: nowrap; }
  .pw-compass { position: absolute; left: 6px; top: 4px; font-size: 11px; font-weight: 800; color: var(--muted); pointer-events: none; }
  .pw-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; font-size: 12px; color: var(--muted); align-items: center; }
  .pw-legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -3px; margin-right: 6px; }
  .pw-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .pw-chips button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; color: var(--ink-2); transition: background-color 150ms ease-out, color 150ms ease-out, border-color 150ms ease-out, transform 160ms var(--ease-out); }
  .pw-chips button:active { transform: scale(.97); }
  .pw-chips button[data-on] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  @media (max-width: 900px) { .pw { grid-template-columns: 1fr; } }
  @media (max-width: 600px) {
    .pw-grid { gap: 2px; }
    .pw-tile { padding: 0; border-radius: 3px; }
    .pw-tile .n, .pw-tile .d { display: none; }
    .pw-tile.photo .badge { right: 1px; bottom: 1px; min-width: 12px; height: 12px; font-size: 8px; padding: 0 3px; }
    .pw-tile.home .n { display: block; font-size: 8px; text-align: center; margin: auto; }
    .pw-cell { border-radius: 3px; }
    .pw-sealabel { font-size: 13px; }
  }

  /* =================== 5. METRO — transit diagram =================== */
  .mt-scroll { overflow-x: auto; margin-inline: calc(-1 * var(--pad)); padding-inline: var(--pad); scrollbar-width: thin; }
  .mt-svg { display: block; min-width: 940px; width: 100%; height: auto; }
  .mt-line { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; transition: opacity 250ms ease-out; }
  .mt-st { cursor: pointer; transition: opacity 250ms ease-out; }
  .mt-st circle.s { fill: #fff; stroke-width: 3.5; transition: r 200ms var(--ease-out); }
  .mt-st text { font-size: 12.5px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; transition: fill 200ms ease-out; }
  .mt-st[data-on] text { fill: var(--accent); }
  .mt-st[data-on] circle.s { r: 8.5; }
  .mt-st:focus-visible { outline: none; }
  .mt-st:focus-visible circle.s { stroke: var(--ink) !important; }
  .mt-ph circle.ring { fill: #fff; stroke-width: 4; }
  .mt-ph .badge rect { fill: var(--accent); }
  .mt-ph .badge text { fill: #fff; font-size: 11px; font-weight: 800; stroke: none; }
  .mt-hub circle.o { fill: var(--ink); }
  .mt-hub circle.i { fill: #fff; }
  .mt-hub text.t { font-family: var(--serif); font-size: 26px; font-weight: 600; fill: var(--ink); }
  .mt-hub text.s { font-size: 12px; font-weight: 600; fill: var(--muted); }
  .mt-lname { font-size: 12px; font-weight: 800; letter-spacing: .04em; }
  .mt-lname rect { rx: 11; }
  .mt-lname text { fill: #fff; }
  .mt[data-line] .mt-line:not([data-on]), .mt[data-line] .mt-st:not([data-lon]), .mt[data-line] .mt-lname:not([data-on]) { opacity: .18; }
  .mt-lines { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
  .mt-lines button { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 13px 7px 9px; font-size: 13px; cursor: pointer; transition: background-color 150ms ease-out, border-color 150ms ease-out, transform 160ms var(--ease-out); }
  .mt-lines button i { width: 22px; height: 6px; border-radius: 3px; background: var(--c); }
  .mt-lines button:active { transform: scale(.97); }
  .mt-lines button[data-on] { border-color: var(--ink); background: #fff; font-weight: 600; }
  .mt-foot { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(24px, 4vw, 56px); margin-top: 26px; align-items: start; }
  .mt-foot .panel h3 { margin-top: 6px; }
  .mt-proj-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; }
  /* draw-in */
  .mt-svg .mt-line { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); }
  .mt-svg.is-in .mt-line { animation: draw 1500ms var(--ease-out) forwards; animation-delay: var(--dl); }
  .mt-svg .mt-st, .mt-svg .mt-lname { opacity: 0; }
  .mt-svg.is-in .mt-st { animation: fadein 300ms ease-out forwards; animation-delay: var(--dl); }
  .mt-svg.is-in .mt-lname { animation: fadein 400ms ease-out forwards; animation-delay: var(--dl); }
  .mt-svg.is-done .mt-st, .mt-svg.is-done .mt-lname { animation: none; opacity: 1; }
  .mt-svg.is-done .mt-line { animation: none; stroke-dashoffset: 0; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fadein { to { opacity: 1; } }
  .mt-hint { display: none; font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  @media (max-width: 900px) { .mt-foot { grid-template-columns: 1fr; } .mt-hint { display: block; } .mt-proj-grid { grid-template-columns: 1fr; } }

  /* =================== 6. TAPE — measuring tape + dimension lines =================== */
  .tp { position: relative; }
  .tp-stage { position: relative; }
  .tp-svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tp-band { fill: #E2B04A; }
  .tp-band-edge { fill: #C9952F; }
  .tp-tick { stroke: #3A2A12; }
  .tp-num { font-size: 13px; font-weight: 800; fill: #3A2A12; font-variant-numeric: tabular-nums; }
  .tp-unit { font-size: 11px; font-weight: 700; fill: #3A2A12; }
  .tp-case-o { fill: var(--ink); }
  .tp-case-i { fill: #2A2D33; }
  .tp-case-t { font-family: var(--serif); font-size: 26px; font-weight: 600; fill: #fff; }
  .tp-case-s { font-size: 9px; font-weight: 700; letter-spacing: .12em; fill: #C9CACE; }
  .tp-dim { cursor: pointer; }
  .tp-dim line, .tp-dim path { stroke: var(--ink-2); stroke-width: 1.3; fill: none; transition: stroke 200ms ease-out; }
  .tp-dim .lab { font-family: var(--serif); font-size: 19px; font-weight: 600; fill: var(--ink); transition: fill 200ms ease-out; }
  .tp-dim .rng { font-size: 12px; font-weight: 700; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .tp-dim .hit { fill: transparent; }
  .tp-dim[data-on] line, .tp-dim[data-on] path { stroke: var(--accent); stroke-width: 2; }
  .tp-dim[data-on] .lab { fill: var(--accent); }
  .tp-dim:focus-visible { outline: none; }
  .tp-dim:focus-visible .lab { text-decoration: underline; }
  @media (hover: hover) and (pointer: fine) { .tp-dim:hover .lab { fill: var(--accent); } }
  .tp-tagline { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 3; }
  .tp-tag foreignObject div { width: 100%; height: 100%; border-radius: 6px; overflow: hidden; background: #fff; box-shadow: 0 8px 22px rgba(16,16,18,.18); display: flex; flex-direction: column; }
  .tp-tag img { width: 100%; height: 72px; object-fit: cover; }
  .tp-tag span { display: block; padding: 6px 8px 7px; font: 600 11.5px/1.25 var(--sans); color: var(--ink); }
  .tp-tag span small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; color: var(--muted); font-size: 10.5px; margin-top: 1px; }
  /* unroll */
  .tp-roll { clip-path: inset(0 100% 0 0); }
  .tp-svg.is-in .tp-roll { animation: unroll 1500ms var(--ease-out) forwards; }
  @keyframes unroll { to { clip-path: inset(0 0 0 0); } }
  .tp-spin { transform-box: fill-box; transform-origin: center; }
  .tp-svg.is-in .tp-spin { animation: spin 1500ms var(--ease-out); }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(-540deg); } }
  .tp-svg .tp-dim, .tp-svg .tp-tag { opacity: 0; }
  .tp-svg.is-in .tp-dim, .tp-svg.is-in .tp-tag { animation: fadein 400ms ease-out forwards; animation-delay: var(--dl); }
  .tp-foot { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(24px, 4vw, 56px); margin-top: 18px; align-items: start; }
  .tp-v { display: none; }
  @media (max-width: 900px) {
    .tp-svg { display: none; }
    .tp-foot { grid-template-columns: 1fr; }
    .tp-v { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 0 16px; position: relative; }
    .tp-vtape { grid-row: 1 / span 99; position: relative; border-radius: 6px 6px 0 0; background: repeating-linear-gradient(180deg, #3A2A12 0 1.5px, transparent 1.5px 12px) right 0 top 0 / 14px 100% no-repeat, repeating-linear-gradient(180deg, #3A2A12 0 1.5px, transparent 1.5px 60px) right 0 top 0 / 26px 100% no-repeat, #E2B04A; }
    .tp-vtape b { position: absolute; left: 6px; font-size: 11px; font-weight: 800; color: #3A2A12; }
    .tp-vrow { padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
    .tp-vrow b { font-family: var(--serif); font-size: 21px; font-weight: 600; }
    .tp-vrow span { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .tp-vrow small { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
    .tp-vrow[data-on] b { color: var(--accent); }
    .tp-vhead { padding: 6px 0 10px; font-size: 13px; color: var(--muted); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 0ms !important; }
    .pw-tile, .pw-cell, .mt-svg .mt-st, .mt-svg .mt-lname, .tp-svg .tp-dim, .tp-svg .tp-tag { opacity: 1; transform: none; }
    .mt-svg .mt-line { stroke-dashoffset: 0; }
    .tp-roll { clip-path: none; }
  }

  /* =================== PICKER (verbatim from PICKER.md) =================== */
  .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
  .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out, transform 160ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (hover: hover) and (pointer: fine) { .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); } }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }
  .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
  <header class="ctx-nav"><div class="wrap">
    <div class="ctx-logo"><b>MN</b> Interiors</div>
    <nav class="ctx-links"><span>Our work</span><span>Services</span><span>Reviews</span><span>FAQ</span></nav>
    <button class="ctx-cta" type="button">Get a free quote</button>
  </div></header>
  <div class="ctx-prev">Previous section · Services</div>

  <section class="sec" id="across-chennai"><div class="wrap">
    <div class="sec-head">
      <div>
        <div class="eyebrow">Across Chennai</div>
        <h2>From Kundrathur <em>to your street.</em></h2>
      </div>
      <p>Everything is built in our own workshop in Kundrathur, then fitted in homes and shops across the city. Free site visit wherever you are in Chennai.</p>
    </div>
    <div id="stage"></div>
  </div></section>

  <div class="ctx-next">Next section · Reviews</div>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Patchwork</button>
    <button class="proto-picker-item">Metro</button>
    <button class="proto-picker-item">Tape</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

      ${dimSvg}
    </svg>
    <div class="tp-v"><div class="tp-vtape" aria-hidden="true"></div><div class="tp-vhead">Measured from our workshop in Kundrathur</div>${vt}</div>
    <div class="tp-foot">
      <div class="panel" aria-live="polite"></div>
      <div><p class="note" style="margin:0 0 6px">Projects on this site</p>${PROJECTS.map(projRow).join('')}<p class="note">Straight-line distances from our workshop, approx. Free site visit in every area and anywhere else in Chennai.</p></div>
    </div>
  </div>`;
}
function initTape(root) {
  const svg = root.querySelector('.tp-svg'), panel = root.querySelector('.panel');
  const dims = [...root.querySelectorAll('.tp-dim')], rows = [...root.querySelectorAll('.tp-vrow')];
  const sel = z => { dims.forEach(d => d.toggleAttribute('data-on', d.dataset.z === z)); rows.forEach(r => r.toggleAttribute('data-on', r.dataset.z === z)); panel.innerHTML = zonePanel(z); };
  dims.forEach(d => { d.addEventListener('click', () => sel(d.dataset.z)); d.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sel(d.dataset.z); } }); });
  rows.forEach(r => r.addEventListener('click', () => sel(r.dataset.z)));
  sel('porur');
  onView(svg, () => svg.classList.add('is-in'), 0.3);
}

const variants = [vPatch, vMetro, vTape];
const inits = [initPatch, initMetro, initTape];

document.addEventListener('click', e => {
  const b = e.target.closest('[data-scope]');
  if (!b) return;
  let t = document.getElementById('demo-toast');
  if (!t) {
    t = document.createElement('div'); t.id = 'demo-toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:2147483646;background:#16181D;color:#FAFAF8;font:500 14px Manrope,system-ui,sans-serif;padding:12px 16px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center;transition:opacity 200ms ease-out;opacity:0';
    document.body.appendChild(t);
  }
  t.textContent = 'Demo: this would open the booking form with the area set to "' + b.dataset.scope + '".';
  t.style.opacity = '1';
  clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = '0'; }, 2600);
});

/* ---------- picker wiring (reference, plus per-variant init/cleanup) ---------- */
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  cleanup.forEach(f => f()); cleanup = [];
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); inits[i](stage); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
}
</script>
