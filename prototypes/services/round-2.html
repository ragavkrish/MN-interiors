<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Services Prototypes 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #B5532F; --accent-hover: #934126; --tint: #F6E7DF; --accent-on-dark: #E08A66;
    --ink: #16181D; --ink-2: #3B3E45; --muted: #5F6268;
    --paper: #FAFAF8; --stone: #E7E5E1; --line: #D3D0CA;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Manrope', system-ui, -apple-system, sans-serif;
    --pad: clamp(16px, 4vw, 56px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  img { display: block; max-width: 100%; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--pad); }

  /* ---------- shared context (mirrors production) ---------- */
  .ctx-nav { position: sticky; top: 0; z-index: 10; background: rgba(250,250,248,.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .ctx-nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; }
  .ctx-logo { font-family: var(--serif); font-size: 24px; font-weight: 600; }
  .ctx-logo b { color: var(--accent); font-weight: 600; }
  .ctx-links { display: flex; gap: 28px; font-size: 15px; color: var(--ink-2); }
  .ctx-cta { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 11px 18px; font: 600 14px var(--sans); }
  @media (max-width: 760px) { .ctx-links { display: none; } }
  .sec { padding: clamp(64px, 9vw, 120px) 0 clamp(72px, 10vw, 140px); }
  .sec-head { text-align: center; max-width: 620px; margin: 0 auto clamp(48px, 6vw, 80px); }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .sec-head h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(44px, 5.6vw, 76px); line-height: 1.02; letter-spacing: -0.01em; margin: 14px 0 20px; }
  .sec-head h2 em { color: var(--accent); font-style: italic; }
  .sec-head p { color: var(--ink-2); font-size: 17px; line-height: 1.65; margin: 0; }
  .ctx-next { background: var(--stone); padding: 64px 0; color: var(--muted); font-size: 14px; text-align: center; }
  /* dark-section mode (used by Cinema) */
  .sec[data-theme="dark"] { background: var(--ink); color: var(--paper); }
  .sec[data-theme="dark"] .eyebrow, .sec[data-theme="dark"] .sec-head h2 em { color: var(--accent-on-dark); }
  .sec[data-theme="dark"] .sec-head p { color: #B9BBC0; }

  .txt-link { color: inherit; font-weight: 600; font-size: 15px; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 2px; transition: color 150ms ease-out; }
  @media (hover: hover) and (pointer: fine) { .txt-link:hover { color: var(--accent); } }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 12px 18px; font: 600 14px var(--sans); cursor: pointer; transition: background-color 150ms ease-out, transform 160ms var(--ease-out); }
  .btn:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .btn:hover { background: var(--accent-hover); } }

  /* =================== 4. FLOOR PLAN — spatial, illustrative =================== */
  .fp { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(32px, 5vw, 72px); align-items: center; }
  .fp-plan { position: relative; }
  .fp-plan svg { width: 100%; height: auto; display: block; overflow: visible; }
  .fp-wall { fill: none; stroke: var(--ink); stroke-linecap: square; }
  .fp-furn { fill: none; stroke: #8B8D93; stroke-width: 1.2; }
  .fp-furn-fill { fill: #ECEAE6; stroke: #8B8D93; stroke-width: 1.2; }
  .fp-door { fill: none; stroke: #A9ABB0; stroke-width: 1; stroke-dasharray: 3 3; }
  .fp-label { font-family: var(--serif); font-style: italic; font-size: 17px; fill: var(--muted); }
  .fp-label-n { font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
  .fp-room { cursor: pointer; outline: none; }
  .fp-room .fp-fill { fill: var(--accent); fill-opacity: 0; transition: fill-opacity 300ms ease-out; }
  .fp-room .fp-ring { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; transition: opacity 200ms ease-out; }
  .fp-room .fp-label, .fp-room .fp-label-n { transition: fill 200ms ease-out; }
  @media (hover: hover) and (pointer: fine) { .fp-room:hover .fp-fill { fill-opacity: .06; } }
  .fp-room[data-on] .fp-fill { fill-opacity: .12; }
  .fp-room[data-on] .fp-ring { opacity: 1; }
  .fp-room[data-on] .fp-label, .fp-room[data-on] .fp-label-n { fill: var(--accent); }
  .fp-room:focus-visible .fp-ring { opacity: 1; stroke-dasharray: 4 3; }
  .fp-pin { fill: var(--accent); }
  .fp-pin-pulse { fill: var(--accent); opacity: .35; transform-box: fill-box; transform-origin: center; animation: fp-pulse 2.2s ease-out infinite; }
  @keyframes fp-pulse { 0% { transform: scale(.6); opacity: .45; } 100% { transform: scale(2.4); opacity: 0; } }
  .fp-room[data-on] .fp-pin-pulse { animation: none; opacity: 0; }
  /* draw-in on mount */
  .fp-draw .fp-wall { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: fp-draw 1400ms var(--ease-out) forwards; }
  .fp-draw .fp-furn, .fp-draw .fp-furn-fill, .fp-draw .fp-label, .fp-draw .fp-label-n, .fp-draw .fp-door, .fp-draw .fp-pin, .fp-draw .fp-pin-pulse { opacity: 0; animation: fp-fade 600ms ease-out 900ms forwards; }
  @keyframes fp-draw { to { stroke-dashoffset: 0; } }
  @keyframes fp-fade { to { opacity: 1; } }
  .fp-hint { margin-top: 14px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .fp-hint i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .fp-detail-in { animation: fp-in 350ms var(--ease-out); }
  @keyframes fp-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fp-num { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--accent); }
  .fp-detail h3 { font-family: var(--serif); font-weight: 500; font-size: clamp(34px, 3.4vw, 48px); line-height: 1.05; margin: 12px 0 16px; }
  .fp-detail p { color: var(--ink-2); font-size: 16px; line-height: 1.7; margin: 0 0 22px; max-width: 44ch; }
  .fp-thumb { aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden; margin-bottom: 22px; background: var(--stone); }
  .fp-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .fp-meta { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .fp-spec { font-size: 14px; color: var(--muted); }
  .fp-tabs { display: none; }
  @media (max-width: 900px) {
    .fp { grid-template-columns: 1fr; }
    .fp-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 4px 0 6px; }
    .fp-tabs button { flex: 0 0 auto; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 9px 14px; font: 500 14px var(--sans); color: var(--ink-2); transition: background-color 150ms ease-out, color 150ms ease-out, border-color 150ms ease-out; }
    .fp-tabs button[data-on] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  }

  /* =================== 5. SENTENCE — copy-led, cursor-follow photo =================== */
  .st { max-width: 1040px; margin: 0 auto; }
  .st-big { font-family: var(--serif); font-weight: 500; font-size: clamp(30px, 3.9vw, 56px); line-height: 1.22; letter-spacing: -0.005em; margin: 0; color: var(--ink); }
  .st-big .dim { color: #8B8D93; }
  .st-word { color: var(--ink); font-style: italic; cursor: pointer; white-space: nowrap; position: relative; outline: none; border-radius: 4px; transition: color 200ms ease-out; }
  .st-word::after { content: ""; position: absolute; left: 0; right: 0; bottom: .06em; height: 1px; background: currentColor; transform: scaleX(.999); transform-origin: left; transition: transform 300ms var(--ease-out); }
  .st-word sup { font-family: var(--sans); font-style: normal; font-size: .26em; font-weight: 600; letter-spacing: .06em; vertical-align: super; margin-left: .2em; color: var(--muted); transition: color 200ms ease-out; }
  .st-word[data-on] { color: var(--accent); }
  .st-word[data-on] sup { color: var(--accent); }
  .st-word:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .st-float { position: fixed; left: 0; top: 0; width: clamp(180px, 15vw, 220px); aspect-ratio: 4 / 5; transform-origin: bottom left; border-radius: 6px; overflow: hidden; pointer-events: none; z-index: 50; opacity: 0; will-change: transform, opacity; transition: opacity 200ms ease-out; box-shadow: 0 24px 60px rgba(22,24,29,.22); }
  .st-float[data-show] { opacity: 1; }
  .st-float img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 250ms ease-out; }
  .st-float img[data-on] { opacity: 1; }
  .st-strip { margin-top: clamp(48px, 6vw, 80px); border-top: 1px solid var(--line); padding-top: 28px; display: grid; grid-template-columns: 140px minmax(0, 1fr) auto; gap: 28px; align-items: start; }
  .st-thumb { aspect-ratio: 4 / 5; border-radius: 6px; overflow: hidden; background: var(--stone); }
  .st-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .st-strip-in { animation: fp-in 300ms var(--ease-out); }
  .st-strip h3 { font-family: var(--serif); font-weight: 500; font-size: 30px; line-height: 1.1; margin: 8px 0 10px; }
  .st-strip p { margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.65; max-width: 60ch; }
  .st-side { text-align: right; display: flex; flex-direction: column; gap: 14px; align-items: flex-end; font-size: 14px; color: var(--muted); }
  @media (hover: hover) and (pointer: fine) { .st-thumb { display: none; } .st-strip { grid-template-columns: minmax(0, 1fr) auto; } }
  @media (max-width: 760px) {
    .st-strip, .st-strip { grid-template-columns: 96px minmax(0, 1fr); }
    .st-side { grid-column: 1 / -1; text-align: left; align-items: flex-start; }
  }

  /* =================== 6. CINEMA — dark, auto-advancing showcase =================== */
  .cn-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; margin-bottom: clamp(28px, 4vw, 48px); }
  .cn-tab { background: none; border: 0; padding: 0 0 16px; text-align: left; color: var(--paper); cursor: pointer; position: relative; opacity: .45; transition: opacity 250ms ease-out; font: inherit; }
  .cn-tab:focus-visible { outline: 2px solid var(--accent-on-dark); outline-offset: 6px; border-radius: 2px; }
  @media (hover: hover) and (pointer: fine) { .cn-tab:hover { opacity: .8; } }
  .cn-tab[data-on] { opacity: 1; }
  .cn-tab-n { display: block; font-size: 12px; font-weight: 600; letter-spacing: .1em; color: #A9ABB0; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .cn-tab-t { font-family: var(--serif); font-size: clamp(20px, 2vw, 28px); font-weight: 500; line-height: 1.15; }
  .cn-track { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(250,250,248,.14); overflow: hidden; }
  .cn-fill { position: absolute; inset: 0; background: var(--accent-on-dark); transform: scaleX(0); transform-origin: left; }
  .cn-tab[data-done] .cn-fill { transform: scaleX(1); }
  .cn-tab[data-on] .cn-fill { animation: cn-prog var(--dur, 6s) linear forwards; }
  .cn-stage[data-paused] .cn-tab[data-on] .cn-fill, .cn-root[data-paused] .cn-tab[data-on] .cn-fill { animation-play-state: paused; }
  @keyframes cn-prog { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .cn-body { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: clamp(28px, 4vw, 56px); align-items: end; }
  .cn-media { position: relative; aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden; background: #23262C; }
  .cn-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.06); transition: opacity 700ms ease-out, transform 1600ms var(--ease-out); }
  .cn-media img[data-on] { opacity: 1; transform: none; }
  .cn-copy-in { animation: fp-in 450ms var(--ease-out); }
  .cn-num { font-family: var(--serif); font-style: italic; font-size: 72px; line-height: 1; color: var(--accent-on-dark); }
  .cn-copy .tag { color: var(--accent-on-dark); margin-top: 18px; }
  .cn-copy h3 { font-family: var(--serif); font-weight: 500; font-size: clamp(32px, 3vw, 44px); line-height: 1.05; margin: 10px 0 14px; }
  .cn-copy p { color: #B9BBC0; font-size: 15px; line-height: 1.7; margin: 0 0 22px; }
  .cn-spec { list-style: none; margin: 0 0 26px; padding: 0; border-top: 1px solid #353840; }
  .cn-spec li { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid #353840; font-size: 14px; }
  .cn-spec span { color: #A9ABB0; }
  .cn-pause { background: none; border: 1px solid #474A52; color: #D0D1D4; border-radius: 999px; padding: 8px 14px; font: 500 13px var(--sans); cursor: pointer; margin-left: 14px; transition: border-color 150ms ease-out, transform 160ms var(--ease-out); }
  .cn-pause:active { transform: scale(0.97); }
  @media (max-width: 900px) {
    .cn-tabs { display: flex; overflow-x: auto; scrollbar-width: none; gap: 20px; }
    .cn-tab { flex: 0 0 auto; min-width: 150px; }
    .cn-body { grid-template-columns: 1fr; }
    .cn-num { font-size: 52px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0ms !important; transition-delay: 0ms !important; }
    .fp-draw .fp-wall { animation: none; stroke-dashoffset: 0; }
    .fp-draw * { animation: none !important; opacity: 1 !important; }
    .fp-pin-pulse { animation: none; opacity: 0; }
    .fp-detail-in, .st-strip-in, .cn-copy-in { animation: none; }
  }

  /* =================== PICKER (verbatim from PICKER.md) =================== */
  .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
  .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out, transform 160ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (hover: hover) and (pointer: fine) { .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); } }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }
  .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>

  <header class="ctx-nav"><div class="wrap">
    <div class="ctx-logo"><b>MN</b> Interiors</div>
    <nav class="ctx-links"><span>Our work</span><span>Services</span><span>Reviews</span><span>FAQ</span></nav>

  <section class="sec" id="services"><div class="wrap">

      <h2>Every room,<br /><em>made with care.</em></h2>
      <p>Whether you need a complete 2BHK, 3BHK, or independent house interior, a brand-new kitchen and wardrobes, or neat interiors for your shop, we build it with care.</p>

  <div class="ctx-next">Next section · Real projects</div>

  <nav class="proto-picker" aria-label="Prototype variants">

const ROOMS = [
  { i: 3, x: 20, y: 20, w: 330, h: 240, lx: 60, ly: 200, px: 185, py: 140 },   // Living
  { i: 0, x: 350, y: 20, w: 230, h: 180, lx: 390, ly: 160, px: 465, py: 110 }, // Kitchen
  { i: 2, x: 350, y: 200, w: 110, h: 100, lx: 368, ly: 268, px: 405, py: 238 }, // Pooja
  { i: 1, x: 20, y: 260, w: 290, h: 170, lx: 64, ly: 412, px: 120, py: 335 },  // Bedroom
];
function planSVG() {
  const room = r => `
    <g class="fp-room" data-i="${r.i}" tabindex="0" role="button" aria-label="${S[r.i].title}">
      <rect class="fp-fill" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" />
      <rect class="fp-ring" x="${r.x + 4}" y="${r.y + 4}" width="${r.w - 8}" height="${r.h - 8}" rx="2" />
      <text class="fp-label-n" x="${r.lx}" y="${r.ly - 20}">${n(r.i)}</text>
      <text class="fp-label" x="${r.lx}" y="${r.ly}">${S[r.i].room}</text>
      <circle class="fp-pin-pulse" cx="${r.px}" cy="${r.py}" r="6" />
      <circle class="fp-pin" cx="${r.px}" cy="${r.py}" r="4" />
    </g>`;
  return `<svg viewBox="0 0 600 450" role="group" aria-label="Floor plan of a home. Select a room to see that service.">
    <!-- furniture (drawn under room hit areas) -->
    <!-- living: TV unit on top wall, sofa, rug -->
    <rect class="fp-furn-fill" x="120" y="28" width="130" height="14" />
    <rect class="fp-furn" x="110" y="150" width="150" height="44" rx="6" />
    <rect class="fp-furn" x="118" y="150" width="134" height="14" rx="3" />
    <rect class="fp-furn" x="140" y="80" width="90" height="50" rx="3" stroke-dasharray="2 3" />
    <!-- kitchen: L counter + hob + sink -->
    <path class="fp-furn-fill" d="M358 28 H572 V160 H550 V50 H358 Z" />
    <circle class="fp-furn" cx="420" cy="39" r="5" /><circle class="fp-furn" cx="440" cy="39" r="5" />
    <rect class="fp-furn" x="553" y="90" width="14" height="30" rx="3" />
    <!-- pooja: mandapam -->
    <path class="fp-furn-fill" d="M380 208 h50 v18 h-50 Z" />
    <path class="fp-furn" d="M392 208 q13 -0 13 0 M380 226 q25 -14 50 0" />
    <!-- bedroom: wardrobe along left wall, bed -->
    <rect class="fp-furn-fill" x="28" y="268" width="20" height="150" />
    <path class="fp-furn" d="M28 300 h20 M28 334 h20 M28 368 h20 M28 400 h20" />
    <rect class="fp-furn" x="170" y="290" width="110" height="100" rx="4" />
    <rect class="fp-furn" x="180" y="296" width="40" height="18" rx="4" /><rect class="fp-furn" x="230" y="296" width="40" height="18" rx="4" />
    <!-- other rooms (not interactive) -->
    <text class="fp-label" x="485" y="262" style="font-size:14px">Dining</text>
    <text class="fp-label" x="335" y="380" style="font-size:14px">Bath</text>
    <text class="fp-label" x="470" y="380" style="font-size:14px">Bedroom 2</text>
    <!-- doors -->
    <path class="fp-door" d="M350 120 a40 40 0 0 1 -40 40" />
    <path class="fp-door" d="M190 260 a36 36 0 0 0 36 36" />
    <!-- walls -->
    <rect class="fp-wall" x="20" y="20" width="560" height="410" stroke-width="5" style="--len:1940" />
    <path class="fp-wall" d="M350 20 V110 M350 160 V300 M350 200 H580 M350 300 H580 M460 200 V300 M20 260 H190 M226 260 H350 M310 260 V430 M420 300 V430" stroke-width="2.2" style="--len:1200" />
    ${ROOMS.map(room).join('')}
  </svg>`;
}
function fpDetail(i) {
  const s = S[i];
  return `<div class="fp-detail-in">
    <div class="fp-thumb"><img src="${IMG[s.key]}" alt="${s.title} by MN Interiors" /></div>
    <span class="fp-num">${n(i)}</span> <span class="tag" style="margin-left:10px">${s.tag}</span>
    <h3>${s.title}</h3>
    <p>${s.body}</p>
    <div class="fp-meta"><button class="btn" type="button">Get a quote for ${s.cta}</button><span class="fp-spec">${s.spec}</span></div>
  </div>`;
}
function vPlan() {
  return `<div class="fp">
    <div class="fp-plan fp-draw">
      <div class="fp-tabs" role="tablist">${S.map((s, i) => `<button type="button" data-i="${i}" ${i === 0 ? 'data-on' : ''}>${s.short}</button>`).join('')}</div>
      ${planSVG()}
      <div class="fp-hint"><i></i>Tap a room to see what we build there</div>
    </div>
    <div class="fp-detail" aria-live="polite">${fpDetail(0)}</div>
  </div>`;
}
function initPlan(root) {
  const rooms = [...root.querySelectorAll('.fp-room')], tabs = [...root.querySelectorAll('.fp-tabs button')];
  const detail = root.querySelector('.fp-detail');
  let cur = 0;
  const set = i => {
    if (i === cur && detail.innerHTML) { /* still sync visuals */ }
    rooms.forEach(r => r.toggleAttribute('data-on', +r.dataset.i === i));
    tabs.forEach(t => t.toggleAttribute('data-on', +t.dataset.i === i));
    if (i !== cur) { detail.innerHTML = fpDetail(i); cur = i; }
  };
  set(0);
  rooms.forEach(r => {
    const i = +r.dataset.i;
    r.addEventListener('click', () => set(i));
    r.addEventListener('focus', () => set(i));
    r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); set(i); } });
  });
  tabs.forEach(t => t.addEventListener('click', () => set(+t.dataset.i)));
}

/* ---------- 5. Sentence ---------- */
function word(i, text) { return `<span class="st-word" tabindex="0" role="button" data-i="${i}">${text}<sup>${n(i)}</sup></span>`; }
function stStrip(i) {
  const s = S[i];
  return `<div class="st-thumb"><img src="${IMG[s.key]}" alt="${s.title} by MN Interiors" /></div>
    <div class="st-strip-in"><span class="tag">${n(i)} · ${s.tag}</span><h3>${s.title}</h3><p>${s.body}</p></div>
    <div class="st-side st-strip-in"><span>${s.spec}</span><a class="txt-link" href="#enquire" onclick="return false">Get a quote for ${s.cta} →</a></div>`;
}
function vSentence() {
  return `<div class="st">
    <p class="st-big">We design and build ${word(0, 'kitchens')} <span class="dim">for everyday South Indian cooking,</span> ${word(1, 'wardrobes')} <span class="dim">that use every inch up to the ceiling,</span> ${word(2, 'pooja rooms')} <span class="dim">with warm light and carved doors, and</span> ${word(3, 'living rooms and shops')} <span class="dim">that people remember.</span></p>
    <div class="st-strip" aria-live="polite">${stStrip(0)}</div>
    <div class="st-float" aria-hidden="true">${S.map(s => `<img src="${IMG[s.key]}" alt="" />`).join('')}</div>
  </div>`;
}
function initSentence(root) {
  const words = [...root.querySelectorAll('.st-word')], strip = root.querySelector('.st-strip');
  const float = root.querySelector('.st-float'), fimgs = [...float.querySelectorAll('img')];
  let cur = 0, tx = 0, ty = 0, x = 0, y = 0, raf = 0, scale = 0.9;
  const set = i => {
    words.forEach((w, j) => w.toggleAttribute('data-on', j === i));
    fimgs.forEach((m, j) => m.toggleAttribute('data-on', j === i));
    if (i !== cur) { strip.innerHTML = stStrip(i); cur = i; }
  };
  set(0); words[0].setAttribute('data-on', '');
  const loop = () => {
    x += (tx - x) * 0.18; y += (ty - y) * 0.18;
    const target = float.hasAttribute('data-show') ? 1 : 0.9;
    scale += (target - scale) * 0.2;
    float.style.transform = `translate3d(${x + 24}px, ${y - float.offsetHeight - 36}px, 0) scale(${scale})`;
    raf = requestAnimationFrame(loop);
  };
  const move = e => { tx = e.clientX; ty = e.clientY; };
  if (fine() && !reduced()) {
    window.addEventListener('pointermove', move);
    raf = requestAnimationFrame(loop);
    cleanup.push(() => { window.removeEventListener('pointermove', move); cancelAnimationFrame(raf); });
  }
  words.forEach((w, i) => {
    w.addEventListener('pointerenter', e => {
      set(i);
      if (fine() && !reduced()) { if (!float.hasAttribute('data-show')) { x = tx = e.clientX; y = ty = e.clientY; } float.setAttribute('data-show', ''); }
    });
    w.addEventListener('pointerleave', () => float.removeAttribute('data-show'));
    w.addEventListener('click', () => set(i));
    w.addEventListener('focus', () => set(i));
  });
}

/* ---------- 6. Cinema ---------- */
const DUR = 6000;
function cnCopy(i) {
  const s = S[i];
  return `<div class="cn-copy-in">
    <div class="cn-num">${n(i)}</div>
    <span class="tag">${s.tag}</span>
    <h3>${s.title}</h3>
    <p>${s.body}</p>
    <ul class="cn-spec">${s.specs.map(([k, v]) => `<li><span>${k}</span>${v}</li>`).join('')}</ul>
    <button class="btn" type="button">Get a quote</button><button class="cn-pause" type="button" aria-pressed="false">Pause</button>
  </div>`;
}
function vCinema() {
  return `<div class="cn-root" style="--dur:${DUR}ms">
    <div class="cn-tabs" role="tablist">${S.map((s, i) => `
      <button class="cn-tab" role="tab" data-i="${i}" aria-selected="${i === 0}"><span class="cn-tab-n">${n(i)}</span><span class="cn-tab-t">${s.short}</span><span class="cn-track"><span class="cn-fill"></span></span></button>`).join('')}
    </div>
    <div class="cn-body">
      <div class="cn-media">${S.map((s, i) => `<img src="${IMG[s.key]}" alt="${i === 0 ? s.title : ''}" ${i === 0 ? 'data-on' : ''} />`).join('')}</div>
      <div class="cn-copy" aria-live="polite">${cnCopy(0)}</div>
    </div>
  </div>`;
}
function initCinema(root) {
  const sec = document.getElementById('services'); sec.dataset.theme = 'dark';
  const box = root.querySelector('.cn-root'), tabs = [...root.querySelectorAll('.cn-tab')], imgs = [...root.querySelectorAll('.cn-media img')];
  const copy = root.querySelector('.cn-copy');
  let cur = -1, timer = 0, left = DUR, started = 0, paused = reduced(), userPaused = false, visible = false;
  const schedule = () => { clearTimeout(timer); if (paused || !visible) return; started = performance.now(); timer = setTimeout(() => set((cur + 1) % S.length), left); };
  const pause = () => { if (paused) return; paused = true; box.setAttribute('data-paused', ''); clearTimeout(timer); left -= performance.now() - started; };
  const resume = () => { if (userPaused || reduced()) return; paused = false; box.removeAttribute('data-paused'); schedule(); };
  function set(i) {
    tabs.forEach((t, j) => { t.toggleAttribute('data-done', j < i); t.removeAttribute('data-on'); t.setAttribute('aria-selected', j === i); });
    void tabs[i].offsetWidth; // restart the progress animation
    tabs[i].setAttribute('data-on', '');
    imgs.forEach((m, j) => { m.toggleAttribute('data-on', j === i); m.alt = j === i ? S[j].title : ''; });
    if (i !== cur) { copy.innerHTML = cnCopy(i); bindPause(); }
    cur = i; left = DUR; schedule();
  }
  function bindPause() {
    const b = copy.querySelector('.cn-pause');
    b.textContent = userPaused ? 'Play' : 'Pause'; b.setAttribute('aria-pressed', userPaused);
    b.addEventListener('click', () => { userPaused = !userPaused; b.textContent = userPaused ? 'Play' : 'Pause'; b.setAttribute('aria-pressed', userPaused); userPaused ? pause() : resume(); });
  }
  if (reduced()) box.setAttribute('data-paused', '');
  tabs.forEach((t, i) => t.addEventListener('click', () => set(i)));
  const media = root.querySelector('.cn-body');
  if (fine()) { media.addEventListener('pointerenter', pause); media.addEventListener('pointerleave', resume); }
  const io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; visible ? (paused ? null : schedule()) : clearTimeout(timer); }, { threshold: 0.4 });
  io.observe(box);
  set(0);
  cleanup.push(() => { clearTimeout(timer); io.disconnect(); delete sec.dataset.theme; });
}

const variants = [vPlan, vSentence, vCinema];
const inits = [initPlan, initSentence, initCinema];

/* ---------- picker wiring (reference, plus per-variant init/cleanup) ---------- */
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  cleanup.forEach(f => f()); cleanup = [];
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); inits[i](stage); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
